<!-- removeNotificationModal -->
<div id="removeNotificationModal" class="modal fade zoomIn" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="NotificationModalbtn-close"></button>
      </div>
      <div class="modal-body">
        <div class="mt-2 text-center">
          <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop" colors="primary:#f7b84b,secondary:#f06548" style="width:100px;height:100px"></lord-icon>
          <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
            <h4>Are you sure ?</h4>
            <p class="text-muted mx-4 mb-0">Are you sure you want to remove this Notification ?</p>
          </div>
        </div>
        <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
          <button type="button" class="btn w-sm btn-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn w-sm btn-danger" id="delete-notification">Yes, Delete It!</button>
        </div>
      </div>

    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->

<!--  Extra Large modal example -->
<div class="modal fade change-backoffice-user-password-modal-xl" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <form id="form_change_backoffice_user_password" method="POST">
        <div class="modal-header">
          <h5 class="modal-title" id="myExtraLargeModalLabel">Cambiar clave</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-xxl-6 col-sm-12 input-group-lg">
              <div class="form-line">
                <label for="email" class="col-form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control validate" value="correo@correo.com" readonly required>
              </div>
            </div>

            <div class="col-xxl-6 col-sm-12 input-group-lg">
              <label for="password" class="col-form-label">Password</label>
              <div class="form-line position-relative auth-pass-inputgroup">
                <input id="password" name="password" type="password" class="form-control validate password-input" required>
                <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted shadow-none password-addon" type="button" id="password-addon"><i class="ri-eye-fill align-middle"></i></button>
              </div>
            </div>

            <div class="col-xxl-6 col-sm-12 input-group-lg">
              <label for="new_password" class="col-form-label">Nueva clave</label>
              <div class="form-line position-relative auth-pass-inputgroup">
                <input id="new_password" name="new_password" type="password" class="form-control validate password-input" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted shadow-none password-addon" type="button" id="new-password-addon"><i class="ri-eye-fill align-middle"></i></button>
              </div>
            </div>

            <div class="col-xxl-6 col-sm-12 input-group-lg">
              <label for="repeat_password" class="col-form-label">Repita clave</label>
              <div class="form-line position-relative auth-pass-inputgroup">
                <input id="repeat_password" name="repeat_password" type="password" class="form-control validate password-input" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted shadow-none password-addon" type="button" id="repeat-password-addon"><i class="ri-eye-fill align-middle"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a href="javascript:void(0);" class="btn btn-link link-success shadow-none fw-medium" data-bs-dismiss="modal"><i class="ri-close-line me-1 align-middle"></i>Cerrar</a>
          <button type="submit" class="btn btn-primary button-change-backoffice-user-password">
            <div class="text-send">
              Guardar
            </div>
            <span class="d-flex align-items-center">
              <span class="spinner-border flex-shrink-0" role="status" style="display: none;">
                <span class="visually-hidden">Por favor, espere...</span>
              </span>
              <span class="flex-grow-1 ms-2" style="display: none;">
                Por favor, espere...
              </span>
            </span>
          </button>
        </div>
      </form>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
